name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (core + dev only, no heavy embedding model)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: Build index (hashing embedder, no model download)
        run: python -m rag_kb index --embedder hashing
      - name: Retrieval evaluation (no API key needed)
        run: python -m rag_kb eval --embedder hashing
